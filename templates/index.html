<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Погода (Без кэша)</title>
</head>
<body>
    <h2>Узнать погоду (Версия БЕЗ кэширования)</h2>
    <input type="text" id="city" placeholder="Введите город (напр. Paris)">
    <button onclick="getWeather()">Узнать</button>
    <p id="result"></p>

    <script>
        async function getWeather() {
            const city = document.getElementById('city').value;
            if (!city) return;

            const resElement = document.getElementById('result');
            resElement.innerText = "Загрузка (имитация долгого запроса)...";

            const start = Date.now();

            const safeCity = encodeURIComponent(city);

            const response = await fetch(`/api/weather?city=${safeCity}`);
            const data = await response.json();

            const timeTaken = Date.now() - start;

            resElement.innerHTML = `
                <b>Город:</b> <span id="cityName"></span> <br>
                <b>Температура:</b> ${data.temperature}°C <br>
                <b>Взято из кэша:</b> <span style="color:red">Нет</span> <br>
                <b>Время ответа:</b> ${timeTaken} мс
            `;

            document.getElementById('cityName').textContent = data.city;
        }
    </script>
</body>
</html>
